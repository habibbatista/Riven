name: Build RIVEN IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate

      - name: Build
        working-directory: iOS
        run: |
          xcodebuild \
            -project RIVEN.xcodeproj \
            -scheme RIVEN \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        working-directory: iOS
        run: |
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/RIVEN.app \
            Payload/

          zip -r RIVEN-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIVEN-unsigned-IPA
          path: iOS/RIVEN-unsigned.ipa

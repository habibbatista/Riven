<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Riven</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-main: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg-light: #ffffff;
      --bg-dark: #000000;
      --text-dark: #111111;
      --text-light: #ffffff;
      --accent-pink: #ff2d55;
      --border-gray: #e5e5e5;
      --radius-squircle: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: var(--text-dark);
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100dvh; 
      background: var(--bg-light);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .screen-view {
      flex: 1;
      display: none;
      flex-direction: column;
      height: calc(100dvh - (65px + var(--safe-bottom)));
      overflow-y: auto;
      position: relative;
    }

    .screen-view.active {
      display: flex !important;
    }

    .icon-svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
    }

    /* FEED SCREEN */
    #feed-screen {
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    .feed-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--safe-top) + 12px) 20px 10px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }

    .feed-tabs {
      display: flex;
      gap: 16px;
      margin: 0 auto;
    }

    .feed-tab {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }

    .feed-tab.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 4px;
    }

    .header-icon {
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .video-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    #feed-video-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      -webkit-appearance: none;
    }

    video::-webkit-media-controls,
    video::-webkit-media-controls-container,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-fullscreen-button,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .custom-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .custom-play-overlay.visible {
      opacity: 1;
    }

    .play-icon-circle {
      width: 68px;
      height: 68px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .upload-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 30px;
      text-align: center;
    }

    .upload-empty-state p {
      font-size: 14px;
      color: #888;
      max-width: 240px;
    }

    .custom-file-upload {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--text-light);
      color: var(--text-dark);
      padding: 12px 20px;
      border-radius: var(--radius-squircle);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #video-file-input {
      display: none;
    }

    .right-action-bar {
      position: absolute;
      right: 16px;
      bottom: calc(20px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #fff;
    }

    .action-count {
      font-size: 12px;
      font-weight: 500;
    }

    /* SEARCH OVERLAY */
    #search-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 150;
      display: none;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 10px);
    }

    #search-overlay.active {
      display: flex;
    }

    .search-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid #222;
    }

    .search-input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: #1c1c1e;
      border-radius: 10px;
      padding: 8px 12px;
      gap: 8px;
    }

    .search-input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      width: 100%;
    }

    .cancel-search-btn {
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .search-results-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-result-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #111;
      cursor: pointer;
    }

    .search-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #333;
      object-fit: cover;
    }

    .search-info {
      display: flex;
      flex-direction: column;
    }

    .search-info .title {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }

    .search-info .subtitle {
      color: #888;
      font-size: 13px;
    }

    /* PROFILE SCREEN */
    #profile-screen {
      background-color: var(--bg-light);
      padding-top: calc(var(--safe-top) + 10px);
    }

    .logged-out-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 20px;
    }

    .logged-out-box h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .logged-out-box p {
      font-size: 14px;
      color: #666;
    }

    .profile-authenticated {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .profile-top-bar {
      display: flex;
      justify-content: flex-end;
      padding: 10px 20px;
    }

    .menu-dots-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #000;
    }

    .profile-card {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 20px;
      margin-bottom: 20px;
    }

    .profile-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .profile-name {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
      color: #000;
    }

    .profile-handle-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .profile-handle {
      font-size: 18px;
      font-weight: 600;
      color: #111;
    }

    .avatar-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      border: 1px solid #ddd;
    }

    .profile-actions-wrapper {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-follow {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-pink);
      color: #fff;
      border: none;
      border-radius: var(--radius-squircle);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .btn-edit-profile {
      width: 100%;
      padding: 12px;
      background-color: #f2f2f7;
      color: #000;
      border: none;
      border-radius: var(--radius-squircle);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .profile-divider {
      width: 100%;
      height: 1px;
      background-color: var(--border-gray);
      margin-bottom: 20px;
    }

    /* EDIT PROFILE MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      border-radius: 20px;
      width: 88%;
      max-width: 340px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content h3 {
      font-size: 18px;
      font-weight: 700;
    }

    .modal-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
    }

    .pfp-upload-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background-color: #f2f2f7;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px dashed #bbb;
    }

    #pfp-file-input {
      display: none;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .modal-btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-btn-cancel { background: #eee; color: #333; }
    .modal-btn-save { background: #000; color: #fff; }

    /* DM SCREEN */
    #dm-screen {
      background-color: var(--bg-light);
      padding-top: var(--safe-top);
    }

    .dm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-gray);
    }

    .dm-title {
      font-size: 18px;
      font-weight: 700;
    }

    .chat-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .dm-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
      gap: 8px;
    }

    .dm-input-wrapper {
      padding: 12px 16px;
      border-top: 1px solid var(--border-gray);
    }

    .dm-input-bubble {
      display: flex;
      align-items: center;
      border: 1.5px solid #111;
      border-radius: var(--radius-squircle);
      padding: 10px 16px;
      gap: 10px;
    }

    .dm-input-bubble input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      background: transparent;
    }

    .bottom-nav {
      height: calc(65px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background-color: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #1a1a1a;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .nav-item {
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 25%;
      height: 100%;
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }

    .nav-item.active {
      opacity: 1;
    }

    .nav-btn-dm {
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid #fff;
      border-radius: 6px;
      padding: 2px 6px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- 1. FEED SCREEN -->
    <section id="feed-screen" class="screen-view active">
      <div class="feed-header">
        <div class="feed-tabs">
          <span class="feed-tab">Friends</span>
          <span class="feed-tab active">For you</span>
        </div>
        <div class="header-icon" onclick="openSearchOverlay()">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
      </div>

      <div class="video-viewport" id="video-container">
        <video id="feed-video-player" playsinline webkit-playsinline disablePictureInPicture loop muted></video>

        <div class="custom-play-overlay" id="custom-play-indicator">
          <div class="play-icon-circle">
            <svg class="icon-svg" style="width:36px; height:36px; fill:#fff;" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>

        <div class="upload-empty-state" id="upload-prompt">
          <svg class="icon-svg" style="width:48px; height:48px; fill:#555;" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/></svg>
          <p>No video loaded. Select a file or capture using your camera.</p>
          <label for="video-file-input" class="custom-file-upload">
            <svg class="icon-svg" style="width:18px; height:18px; fill:#000;" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            Upload or Record Video
          </label>
          <input type="file" id="video-file-input" accept="video/*" capture="environment">
        </div>

        <div class="right-action-bar">
          <div class="action-item" onclick="toggleLike()">
            <svg class="icon-svg" id="like-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span class="action-count" id="like-count">0</span>
          </div>
          <div class="action-item">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            <span class="action-count">0</span>
          </div>
          <div class="action-item">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7 0-.24-.04-.47-.09-.7l6.96-4.11c.52.48 1.2.78 1.96.78 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.33 6.82 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.82 0 1.5-.33 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            <span class="action-count">0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- SEARCH OVERLAY -->
    <div id="search-overlay">
      <div class="search-header">
        <div class="search-input-box">
          <svg class="icon-svg" style="width:18px; height:18px; fill:#888;" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="Search accounts, tags, videos..." oninput="handleSearch(this.value)">
        </div>
        <span class="cancel-search-btn" onclick="closeSearchOverlay()">Cancel</span>
      </div>
      <div class="search-results-list" id="search-results">
        <div style="color: #666; font-size: 14px; text-align: center; padding-top: 20px;">Type to search users and posts...</div>
      </div>
    </div>

    <!-- 2. DM SCREEN -->
    <section id="dm-screen" class="screen-view">
      <header class="dm-header">
        <span class="dm-title">Messages</span>
        <svg class="icon-svg" style="fill:#111;" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </header>

      <div class="chat-body" id="chat-body">
        <div class="dm-empty-state">
          <svg class="icon-svg" style="width:40px; height:40px; fill:#ccc;" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
          <p>No messages yet</p>
        </div>
      </div>

      <div class="dm-input-wrapper">
        <div class="dm-input-bubble">
          <input type="text" id="dm-text-input" placeholder="Message...">
          <svg class="icon-svg" style="fill:#111; cursor:pointer;" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </div>
      </div>
    </section>

    <!-- 3. PROFILE SCREEN -->
    <section id="profile-screen" class="screen-view">
      <div class="logged-out-box" id="logged-out-state">
        <svg class="icon-svg" style="width:64px; height:64px; fill:#ccc;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        <h2>Please log in first</h2>
        <p>Sign in with Google to view your profile.</p>
        <button class="btn-follow" style="max-width: 240px; background:#000;" onclick="signInWithGoogle()">Sign in with Google</button>
      </div>

      <div class="profile-authenticated" id="logged-in-state" style="display:none;">
        <div class="profile-top-bar">
          <button class="menu-dots-btn">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          </button>
        </div>

        <div class="profile-card">
          <div class="profile-meta">
            <h1 class="profile-name" id="user-display-name">---</h1>
            <div class="profile-handle-row">
              <span class="profile-handle" id="user-display-handle">@---</span>
            </div>
          </div>
          <img class="avatar-circle" id="profile-avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'><circle cx='45' cy='45' r='45' fill='%23eee'/></svg>">
        </div>

        <div class="profile-actions-wrapper">
          <button class="btn-follow">Follow</button>
          <button class="btn-edit-profile" onclick="openEditModal()">Edit Profile</button>
        </div>

        <div class="profile-divider"></div>
      </div>
    </section>

    <!-- EDIT PROFILE MODAL -->
    <div class="modal-overlay" id="edit-modal">
      <div class="modal-content">
        <h3>Edit Profile</h3>
        <input type="text" id="edit-name-input" class="modal-input" placeholder="Display Name">
        <input type="text" id="edit-handle-input" class="modal-input" placeholder="Handle (e.g. user1270108)">
        
        <label for="pfp-file-input" class="pfp-upload-label">
          <svg class="icon-svg" style="width:16px; height:16px; fill:#333;" viewBox="0 0 24 24"><path d="M19 7v10H5V7h14m0-2H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-5 8l-2.5-3.15L9.5 13l-1.5-2L5 15h14l-4-5z"/></svg>
          Choose Image from Phone
        </label>
        <input type="file" id="pfp-file-input" accept="image/*">

        <div class="modal-buttons">
          <button class="modal-btn modal-btn-cancel" onclick="closeEditModal()">Cancel</button>
          <button class="modal-btn modal-btn-save" onclick="saveProfileChanges()">Save</button>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('feed-screen', this)">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </div>
      <div class="nav-item" onclick="switchTab('feed-screen', this)">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="nav-item" onclick="switchTab('dm-screen', this)">
        <span class="nav-btn-dm">DM</span>
      </div>
      <div class="nav-item" id="nav-profile-btn" onclick="openMyProfile(this)">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </div>
    </nav>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNj19A3A3764GpZO8rkhLYFrWXk9k_HEM",
      authDomain: "riven-social.firebaseapp.com",
      projectId: "riven-social",
      storageBucket: "riven-social.firebasestorage.app",
      messagingSenderId: "412017575651",
      appId: "1:412017575651:web:82eaf6ad241ac8d6cfe7d6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let uploadedProfilePicData = null;
    let isLiked = false;

    const databaseIndex = [
      { name: "Official Riven", handle: "user8492011", pfp: "https://via.placeholder.com/150/111111/ffffff?text=R" },
      { name: "Community Hub", handle: "user2001920", pfp: "https://via.placeholder.com/150/ff2d55/ffffff?text=C" }
    ];

    window.signInWithGoogle = async function() {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Auth Error:", error);
      }
    };

    function generateRandomUserHandle() {
      const randomNumber = Math.floor(1000000 + Math.random() * 9000000);
      return `user${randomNumber}`;
    }

    async function loadSavedUserData(uid) {
      try {
        const docRef = doc(db, "users", uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          return docSnap.data();
        }
      } catch(e) {
        console.log("Firestore fallback to local storage");
      }

      const localData = localStorage.getItem(`riven_user_${uid}`);
      return localData ? JSON.parse(localData) : null;
    }

    async function saveUserData(uid, data) {
      localStorage.setItem(`riven_user_${uid}`, JSON.stringify(data));
      try {
        await setDoc(doc(db, "users", uid), data, { merge: true });
      } catch(e) {
        console.warn("Firestore save error:", e);
      }
    }

    // FIX FOR GITHUB PAGES 404: Read handle safely from URL hash (#/@handle)
    function getHandleFromUrl() {
      const hash = window.location.hash;
      if (hash.startsWith('#/@')) {
        return hash.replace('#/@', '');
      }
      return null;
    }

    // FIX FOR GITHUB PAGES 404: Set Hash URL instead of dynamic pathname
    function setProfileUrl(handle) {
      const cleanHandle = handle.replace('@', '').toLowerCase();
      const newHash = `#/@${cleanHandle}`;
      if (window.location.hash !== newHash) {
        history.pushState(null, '', newHash);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const loggedOutBox = document.getElementById('logged-out-state');
      const loggedInBox = document.getElementById('logged-in-state');

      if (user) {
        loggedOutBox.style.display = 'none';
        loggedInBox.style.display = 'flex';
        
        let savedData = await loadSavedUserData(user.uid);
        
        let handle = savedData?.handle || getHandleFromUrl() || generateRandomUserHandle();
        let name = savedData?.name || `User ${handle.replace('user', '')}`;
        let pfp = savedData?.pfp || user.photoURL;

        updateProfileDisplay(name, handle, pfp);
        saveUserData(user.uid, { name, handle, pfp });
      } else {
        loggedOutBox.style.display = 'flex';
        loggedInBox.style.display = 'none';
      }
    });

    function updateProfileDisplay(name, handle, pfp) {
      const cleanHandle = handle.replace('@', '').toLowerCase();
      document.getElementById('user-display-name').innerText = name;
      document.getElementById('user-display-handle').innerText = `@${cleanHandle}`;

      setProfileUrl(cleanHandle);

      if (pfp) {
        document.getElementById('profile-avatar-img').src = pfp;
      }
    }

    // SEARCH SYSTEM
    window.openSearchOverlay = function() {
      document.getElementById('search-overlay').classList.add('active');
      document.getElementById('search-input').focus();
    };

    window.closeSearchOverlay = function() {
      document.getElementById('search-overlay').classList.remove('active');
    };

    window.handleSearch = function(query) {
      const resultsContainer = document.getElementById('search-results');
      const q = query.trim().toLowerCase();

      if (!q) {
        resultsContainer.innerHTML = `<div style="color: #666; font-size: 14px; text-align: center; padding-top: 20px;">Type to search users...</div>`;
        return;
      }

      const matches = databaseIndex.filter(item => 
        item.name.toLowerCase().includes(q) || item.handle.toLowerCase().includes(q)
      );

      if (currentUser) {
        const curHandle = document.getElementById('user-display-handle').innerText.replace('@', '');
        const curName = document.getElementById('user-display-name').innerText;
        if (curHandle.includes(q) || curName.toLowerCase().includes(q)) {
          matches.unshift({
            name: curName,
            handle: curHandle,
            pfp: document.getElementById('profile-avatar-img').src
          });
        }
      }

      if (matches.length === 0) {
        resultsContainer.innerHTML = `<div style="color: #666; font-size: 14px; text-align: center; padding-top: 20px;">No results found for "${query}"</div>`;
        return;
      }

      resultsContainer.innerHTML = matches.map(m => `
        <div class="search-result-card" onclick="selectSearchResult('${m.handle}', '${m.name}', '${m.pfp}')">
          <img class="search-avatar" src="${m.pfp}" />
          <div class="search-info">
            <span class="title">${m.name}</span>
            <span class="subtitle">@${m.handle}</span>
          </div>
        </div>
      `).join('');
    };

    window.selectSearchResult = function(handle, name, pfp) {
      closeSearchOverlay();
      switchTab('profile-screen', document.getElementById('nav-profile-btn'));
      updateProfileDisplay(name, handle, pfp);
    };

    // EDIT PROFILE
    window.openEditModal = function() {
      document.getElementById('edit-name-input').value = document.getElementById('user-display-name').innerText;
      document.getElementById('edit-handle-input').value = document.getElementById('user-display-handle').innerText.replace('@', '');
      uploadedProfilePicData = null;
      document.getElementById('edit-modal').style.display = 'flex';
    };

    window.closeEditModal = function() {
      document.getElementById('edit-modal').style.display = 'none';
    };

    document.getElementById('pfp-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          uploadedProfilePicData = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    window.saveProfileChanges = async function() {
      const newName = document.getElementById('edit-name-input').value || "User";
      const newHandle = document.getElementById('edit-handle-input').value || generateRandomUserHandle();
      const currentPfp = uploadedProfilePicData || document.getElementById('profile-avatar-img').src;

      updateProfileDisplay(newName, newHandle, currentPfp);

      if (currentUser) {
        await saveUserData(currentUser.uid, {
          name: newName,
          handle: newHandle,
          pfp: currentPfp
        });
      }

      closeEditModal();
    };

    window.openMyProfile = function(navElement) {
      switchTab('profile-screen', navElement);
      const handle = document.getElementById('user-display-handle').innerText.replace('@', '');
      if (handle && handle !== '---') {
        setProfileUrl(handle);
      }
    };

    // INLINE VIDEO CONTROL
    const videoInput = document.getElementById('video-file-input');
    const videoPlayer = document.getElementById('feed-video-player');
    const videoContainer = document.getElementById('video-container');
    const uploadPrompt = document.getElementById('upload-prompt');
    const playIndicator = document.getElementById('custom-play-indicator');

    videoInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        videoPlayer.src = fileURL;
        videoPlayer.style.display = 'block';
        uploadPrompt.style.display = 'none';
        
        videoPlayer.play().catch(err => {
          console.log("Autoplay bypass:", err);
        });
      }
    });

    videoContainer.addEventListener('click', function(e) {
      if (e.target.closest('.right-action-bar') || e.target.closest('#upload-prompt')) return;

      if (!videoPlayer.src) return;

      if (videoPlayer.paused) {
        videoPlayer.play();
        showPlayIndicator(false);
      } else {
        videoPlayer.pause();
        showPlayIndicator(true);
      }
    });

    function showPlayIndicator(paused) {
      if (paused) {
        playIndicator.classList.add('visible');
      } else {
        playIndicator.classList.remove('visible');
      }
    }

    // LIKE TOGGLE SYSTEM
    window.toggleLike = function() {
      isLiked = !isLiked;
      const likeIcon = document.getElementById('like-icon');
      const likeCount = document.getElementById('like-count');
      
      if (isLiked) {
        likeIcon.style.fill = '#ff2d55';
        likeCount.innerText = '1';
      } else {
        likeIcon.style.fill = 'currentColor';
        likeCount.innerText = '0';
      }
    };

    // TAB SWITCHER
    window.switchTab = function(screenId, navElement) {
      document.querySelectorAll('.screen-view').forEach(screen => {
        screen.classList.remove('active');
      });
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });

      const selectedScreen = document.getElementById(screenId);
      if (selectedScreen) selectedScreen.classList.add('active');
      if (navElement) navElement.classList.add('active');
    };
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Riven</title>

  <!-- Google Fonts: Poppins for Everything -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-main: 'Poppins', sans-serif;
      --bg-light: #ffffff;
      --bg-dark: #121212;
      --text-dark: #111111;
      --text-light: #ffffff;
      --accent-pink: #ff2d55;
      --accent-orange: #ff9500;
      --border-gray: #e5e5e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Phone Shell Container */
    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: var(--bg-light);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Screen Views Switcher */
    .screen-view {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }

    .screen-view.active {
      display: flex;
    }

    /* ==========================================
       1. FYP / FEED SCREEN (DARK MODE)
       ========================================== */
    #feed-screen {
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    .feed-header {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .feed-tabs {
      display: flex;
      gap: 20px;
      margin: 0 auto;
    }

    .feed-tab {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }

    .feed-tab.active {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    .search-icon {
      font-size: 20px;
      cursor: pointer;
    }

    .video-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #1e1e1e;
    }

    .video-placeholder-text {
      font-size: 48px;
      font-weight: 700;
      color: #000;
    }

    .right-action-bar {
      position: absolute;
      right: 15px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 5;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }

    .action-icon {
      font-size: 26px;
    }

    .action-count {
      font-size: 12px;
      font-weight: 600;
    }

    .feed-overlay-bottom {
      position: absolute;
      bottom: 20px;
      left: 15px;
      z-index: 5;
    }

    .feed-handle {
      font-size: 16px;
      font-weight: 700;
    }

    .feed-desc {
      font-size: 14px;
      font-weight: 400;
      opacity: 0.9;
    }

    /* ==========================================
       2. PROFILE SCREEN (LIGHT MODE)
       ========================================== */
    #profile-screen {
      background-color: var(--bg-light);
      padding: 20px;
    }

    .profile-top-bar {
      display: flex;
      justify-content: flex-end;
      padding-bottom: 10px;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 10px;
    }

    .profile-info h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
    }

    .profile-info p {
      font-size: 16px;
      font-weight: 500;
      color: #666;
    }

    .avatar-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ddd;
    }

    .auth-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .follow-btn {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background-color: var(--accent-pink);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .profile-divider {
      margin-top: 25px;
      border: none;
      border-top: 1px solid #ccc;
    }

    .profile-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .grid-item {
      aspect-ratio: 9/16;
      background-color: #a0a0a0;
      border-radius: 8px;
      position: relative;
      padding: 6px;
      display: flex;
      align-items: flex-end;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    /* ==========================================
       3. DM SCREEN (LIGHT MODE)
       ========================================== */
    #dm-screen {
      background-color: var(--bg-light);
      display: flex;
      flex-direction: column;
    }

    .dm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-gray);
    }

    .dm-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dm-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .dm-user-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dm-user-name {
      font-size: 18px;
      font-weight: 700;
    }

    .streak-badge {
      color: var(--accent-orange);
      font-size: 16px;
      font-weight: 700;
    }

    .dm-actions {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 18px;
    }

    .chat-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .mystery-block {
      align-self: flex-end;
      width: 110px;
      height: 130px;
      background-color: #8e8e93;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: 700;
      color: #333;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 85%;
    }

    .msg-sender-name {
      font-size: 13px;
      font-weight: 500;
      color: #777;
      margin-left: 42px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .msg-avatar-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .msg-bubble-black {
      background-color: #000;
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
    }

    .safety-banner {
      margin-top: 10px;
      padding: 8px 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 400;
      color: #444;
      line-height: 1.4;
    }

    .dm-input-wrapper {
      padding: 10px 15px;
    }

    .dm-input-bubble {
      display: flex;
      align-items: center;
      border: 2px solid #000;
      border-radius: 40px;
      padding: 8px 18px;
      gap: 10px;
    }

    .dm-input-bubble input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      font-weight: 400;
      background: transparent;
    }

    .input-icons {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
    }

    /* ==========================================
       PERSISTENT BOTTOM NAV BAR
       ========================================== */
    .bottom-nav {
      height: 65px;
      background-color: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #222;
      z-index: 20;
    }

    .nav-item {
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 100%;
    }

    .nav-btn-dm {
      font-size: 14px;
      font-weight: 700;
      border: 1.5px solid #fff;
      border-radius: 6px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- 1. FEED SCREEN (Dark Mode FYP) -->
    <section id="feed-screen" class="screen-view active">
      <div class="feed-header">
        <div class="feed-tabs">
          <span class="feed-tab">Friends</span>
          <span class="feed-tab active">For you</span>
        </div>
        <span class="search-icon">🔍</span>
      </div>

      <div class="video-viewport">
        <div class="video-placeholder-text">video</div>

        <div class="right-action-bar">
          <div class="action-item">
            <span class="action-icon">🤍</span>
            <span class="action-count">67</span>
          </div>
          <div class="action-item">
            <span class="action-icon">💬</span>
            <span class="action-count">20</span>
          </div>
          <div class="action-item">
            <span class="action-icon">↪️</span>
            <span class="action-count">20K</span>
          </div>
          <div class="action-item">
            <span class="action-icon">📑</span>
            <span class="action-count">0</span>
          </div>
        </div>

        <div class="feed-overlay-bottom">
          <div class="feed-handle">@handle</div>
          <div class="feed-desc">desc</div>
        </div>
      </div>
    </section>

    <!-- 2. PROFILE SCREEN (Light Mode) -->
    <section id="profile-screen" class="screen-view">
      <div class="profile-top-bar">
        <span style="font-size: 22px; cursor: pointer;">⋮</span>
      </div>
      <div class="profile-header">
        <div class="profile-info">
          <h1 id="user-display-name">Name</h1>
          <p id="user-display-handle">@handle</p>
        </div>
        <img class="avatar-circle" src="https://via.placeholder.com/90" alt="Avatar" id="profile-avatar-img">
      </div>

      <!-- Google Sign-In Button -->
      <button class="auth-btn" onclick="signInWithGoogle()">Sign in with Google</button>
      <button class="follow-btn">Follow</button>
      <hr class="profile-divider">
      <div class="profile-grid">
        <div class="grid-item">👁️ 2K</div>
      </div>
    </section>

    <!-- 3. DIRECT MESSAGES SCREEN (Light Mode) -->
    <section id="dm-screen" class="screen-view">
      <header class="dm-header">
        <div class="dm-header-left">
          <img class="dm-avatar" src="https://via.placeholder.com/40" alt="Avatar">
          <div class="dm-user-title">
            <span class="dm-user-name">Name</span>
            <span class="streak-badge">🔥35</span>
          </div>
        </div>
        <div class="dm-actions">
          <span>📹</span>
          <span>📞</span>
          <span>🚩</span>
          <span>⋮</span>
        </div>
      </header>

      <div class="chat-body" id="chat-messages-container">
        <!-- Attachment / Content Box -->
        <div class="mystery-block">?</div>

        <!-- Received Message with Safety Filter Trigger -->
        <div class="msg-group">
          <span class="msg-sender-name">Name</span>
          <div class="msg-row">
            <div class="msg-avatar-small">🙁</div>
            <div class="msg-bubble-black">I think I don’t wanna live anymore</div>
          </div>
          <!-- Automated Crisis Safety Text -->
          <div class="safety-banner">
            If you or someone you know is struggling or in crisis, help is available. You are not alone.
          </div>
        </div>
      </div>

      <div class="dm-input-wrapper">
        <div class="dm-input-bubble">
          <input type="text" id="dm-message-input" placeholder="Message">
          <div class="input-icons">
            <span>🙂</span>
            <span>🖼️</span>
          </div>
        </div>
      </div>
    </section>

    <!-- PERSISTENT BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
      <div class="nav-item" onclick="switchTab('feed-screen')">🏠</div>
      <div class="nav-item">📷</div>
      <div class="nav-item" onclick="switchTab('dm-screen')">
        <span class="nav-btn-dm">DM</span>
      </div>
      <div class="nav-item" onclick="switchTab('profile-screen')">👤</div>
    </nav>

  </div>

  <!-- FIREBASE MODULES CONNECTION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCNj19A3A3764GpZO8rkhLYFrWXk9k_HEM",
      authDomain: "riven-social.firebaseapp.com",
      projectId: "riven-social",
      storageBucket: "riven-social.firebasestorage.app",
      messagingSenderId: "412017575651",
      appId: "1:412017575651:web:82eaf6ad241ac8d6cfe7d6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Google Sign-In Function
    window.signInWithGoogle = async function() {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        updateProfileUI(user);
      } catch (error) {
        console.error("Google Sign-In Error:", error);
      }
    };

    // Track User Auth State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        updateProfileUI(user);
      }
    });

    function updateProfileUI(user) {
      document.getElementById('user-display-name').innerText = user.displayName || "User";
      document.getElementById('user-display-handle').innerText = `@${user.email.split('@')[0]}`;
      if (user.photoURL) {
        document.getElementById('profile-avatar-img').src = user.photoURL;
      }
    }

    // View Navigation Logic
    window.switchTab = function(screenId) {
      document.querySelectorAll('.screen-view').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId).classList.add('active');
    };
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Riven</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-main: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg-light: #ffffff;
      --bg-dark: #000000;
      --text-dark: #111111;
      --text-light: #ffffff;
      --accent-pink: #ff2d55;
      --accent-orange: #ff9500;
      --border-gray: #eeeeee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
    }

    body {
      background-color: #000;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: var(--bg-light);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Screen Views Switcher */
    .screen-view {
      flex: 1;
      display: none;
      flex-direction: column;
      height: calc(100vh - 65px);
      overflow-y: auto;
      position: relative;
    }

    .screen-view.active {
      display: flex !important;
    }

    /* SVG Icon Helper Styles */
    .icon-svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
    }

    /* ==========================================
       1. FEED SCREEN (VIDEO MEDIA STREAM)
       ========================================== */
    #feed-screen {
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    .feed-header {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .feed-tabs {
      display: flex;
      gap: 16px;
      margin: 0 auto;
    }

    .feed-tab {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    .feed-tab.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 4px;
    }

    .header-icon {
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .video-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    #feed-video-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .upload-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 30px;
      text-align: center;
    }

    .upload-empty-state p {
      font-size: 14px;
      color: #888;
      max-width: 240px;
    }

    .custom-file-upload {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--text-light);
      color: var(--text-dark);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .custom-file-upload:active {
      opacity: 0.8;
    }

    #video-file-input {
      display: none;
    }

    .right-action-bar {
      position: absolute;
      right: 16px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #fff;
    }

    .action-count {
      font-size: 12px;
      font-weight: 500;
    }

    /* ==========================================
       2. PROFILE SCREEN
       ========================================== */
    #profile-screen {
      background-color: var(--bg-light);
      padding: 24px 20px;
    }

    .logged-out-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }

    .logged-out-box h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .logged-out-box p {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .profile-authenticated {
      display: none;
      flex-direction: column;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .profile-info h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }

    .profile-info p {
      font-size: 14px;
      color: #666;
      font-weight: 500;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background: #f0f0f0;
      border: 1px solid var(--border-gray);
    }

    .auth-btn {
      width: 100%;
      max-width: 280px;
      padding: 14px 20px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .signout-btn {
      margin-top: 30px;
      background-color: #ff3b30;
    }

    /* ==========================================
       3. DM SCREEN
       ========================================== */
    #dm-screen {
      background-color: var(--bg-light);
    }

    .dm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-gray);
    }

    .dm-title {
      font-size: 18px;
      font-weight: 700;
    }

    .chat-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dm-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
      gap: 8px;
    }

    .dm-input-wrapper {
      padding: 12px 16px;
      border-top: 1px solid var(--border-gray);
    }

    .dm-input-bubble {
      display: flex;
      align-items: center;
      border: 1.5px solid #111;
      border-radius: 25px;
      padding: 10px 16px;
      gap: 10px;
    }

    .dm-input-bubble input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      background: transparent;
    }

    /* ==========================================
       PERSISTENT BOTTOM NAVIGATION
       ========================================== */
    .bottom-nav {
      height: 65px;
      background-color: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #1a1a1a;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .nav-item {
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 25%;
      height: 100%;
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }

    .nav-item.active {
      opacity: 1;
    }

    .nav-btn-dm {
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid #fff;
      border-radius: 6px;
      padding: 2px 6px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- 1. FEED SCREEN -->
    <section id="feed-screen" class="screen-view active">
      <div class="feed-header">
        <div class="feed-tabs">
          <span class="feed-tab">Friends</span>
          <span class="feed-tab active">For you</span>
        </div>
        <div class="header-icon">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
      </div>

      <div class="video-viewport">
        <video id="feed-video-player" playsinline loop controls></video>

        <div class="upload-empty-state" id="upload-prompt">
          <svg class="icon-svg" style="width:48px; height:48px; fill:#555;" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/></svg>
          <p>No video loaded. Select a file or capture using your camera.</p>
          <label for="video-file-input" class="custom-file-upload">
            <svg class="icon-svg" style="width:18px; height:18px; fill:#000;" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            Upload or Record Video
          </label>
          <input type="file" id="video-file-input" accept="video/*" capture="environment">
        </div>

        <div class="right-action-bar">
          <div class="action-item">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span class="action-count">0</span>
          </div>
          <div class="action-item">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            <span class="action-count">0</span>
          </div>
          <div class="action-item">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7 0-.24-.04-.47-.09-.7l6.96-4.11c.52.48 1.2.78 1.96.78 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.33 6.82 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.82 0 1.5-.33 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            <span class="action-count">0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. DM SCREEN -->
    <section id="dm-screen" class="screen-view">
      <header class="dm-header">
        <span class="dm-title">Messages</span>
        <svg class="icon-svg" style="fill:#111;" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </header>

      <div class="chat-body" id="chat-body">
        <div class="dm-empty-state">
          <svg class="icon-svg" style="width:40px; height:40px; fill:#ccc;" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
          <p>No messages yet</p>
        </div>
      </div>

      <div class="dm-input-wrapper">
        <div class="dm-input-bubble">
          <input type="text" id="dm-text-input" placeholder="Message...">
          <svg class="icon-svg" style="fill:#111; cursor:pointer;" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </div>
      </div>
    </section>

    <!-- 3. PROFILE SCREEN -->
    <section id="profile-screen" class="screen-view">
      
      <!-- LOGGED OUT VIEW -->
      <div class="logged-out-box" id="logged-out-state">
        <svg class="icon-svg" style="width:64px; height:64px; fill:#ccc;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        <h2>Please log in first</h2>
        <p>Sign in with your Google account to access your account details and settings.</p>
        <button class="auth-btn" onclick="signInWithGoogle()">
          <svg class="icon-svg" style="width:18px; height:18px; fill:#fff;" viewBox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C6.721,2,2,6.721,2,12.545s4.721,10.545,10.545,10.545c6.089,0,10.127-4.281,10.127-10.3c0-0.693-0.074-1.365-0.198-2.011H12.545z"/></svg>
          Sign in with Google
        </button>
      </div>

      <!-- LOGGED IN VIEW -->
      <div class="profile-authenticated" id="logged-in-state">
        <div class="profile-header">
          <div class="profile-info">
            <h1 id="user-display-name">Name</h1>
            <p id="user-display-handle">@handle</p>
          </div>
          <img class="avatar-circle" id="profile-avatar-img" src="" alt="Avatar">
        </div>
        <button class="auth-btn signout-btn" onclick="signOutUser()">Sign Out</button>
      </div>

    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('feed-screen', this)">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </div>
      <div class="nav-item" onclick="switchTab('feed-screen', this)">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="nav-item" onclick="switchTab('dm-screen', this)">
        <span class="nav-btn-dm">DM</span>
      </div>
      <div class="nav-item" onclick="switchTab('profile-screen', this)">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </div>
    </nav>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNj19A3A3764GpZO8rkhLYFrWXk9k_HEM",
      authDomain: "riven-social.firebaseapp.com",
      projectId: "riven-social",
      storageBucket: "riven-social.firebasestorage.app",
      messagingSenderId: "412017575651",
      appId: "1:412017575651:web:82eaf6ad241ac8d6cfe7d6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Google Auth Functions
    window.signInWithGoogle = async function() {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Auth Error:", error);
      }
    };

    window.signOutUser = async function() {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Sign Out Error:", error);
      }
    };

    // Track User Auth State
    onAuthStateChanged(auth, (user) => {
      const loggedOutBox = document.getElementById('logged-out-state');
      const loggedInBox = document.getElementById('logged-in-state');

      if (user) {
        loggedOutBox.style.display = 'none';
        loggedInBox.style.display = 'flex';
        document.getElementById('user-display-name').innerText = user.displayName || "User";
        document.getElementById('user-display-handle').innerText = `@${user.email.split('@')[0]}`;
        if (user.photoURL) {
          document.getElementById('profile-avatar-img').src = user.photoURL;
        }
      } else {
        loggedOutBox.style.display = 'flex';
        loggedInBox.style.display = 'none';
      }
    });

    // Handle Local Video Stream / File Upload
    const videoInput = document.getElementById('video-file-input');
    const videoPlayer = document.getElementById('feed-video-player');
    const uploadPrompt = document.getElementById('upload-prompt');

    videoInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        videoPlayer.src = fileURL;
        videoPlayer.style.display = 'block';
        uploadPrompt.style.display = 'none';
        videoPlayer.play();
      }
    });

    // View Navigation Switcher
    window.switchTab = function(screenId, navElement) {
      document.querySelectorAll('.screen-view').forEach(screen => {
        screen.classList.remove('active');
      });
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });

      const selectedScreen = document.getElementById(screenId);
      if (selectedScreen) selectedScreen.classList.add('active');
      if (navElement) navElement.classList.add('active');
    };
  </script>

</body>
</html>

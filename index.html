<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Riven</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-main: 'Poppins', sans-serif;
      --bg-light: #ffffff;
      --bg-dark: #121212;
      --text-dark: #111111;
      --text-light: #ffffff;
      --accent-pink: #ff2d55;
      --accent-orange: #ff9500;
      --border-gray: #e5e5e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: var(--bg-light);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Properly Hiding Inactive Screens */
    .screen-view {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      height: calc(100vh - 65px);
    }

    .screen-view.active {
      display: flex !important;
    }

    /* ================= FYP / FEED ================= */
    #feed-screen {
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    .feed-header {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .feed-tabs {
      display: flex;
      gap: 20px;
      margin: 0 auto;
    }

    .feed-tab {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }

    .feed-tab.active {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 2px;
    }

    .video-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #1e1e1e;
    }

    .video-placeholder-text {
      font-size: 40px;
      font-weight: 700;
      color: #333;
    }

    .right-action-bar {
      position: absolute;
      right: 15px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 5;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }

    .action-icon {
      font-size: 24px;
    }

    .action-count {
      font-size: 12px;
      font-weight: 600;
    }

    .feed-overlay-bottom {
      position: absolute;
      bottom: 20px;
      left: 15px;
      z-index: 5;
    }

    .feed-handle {
      font-size: 16px;
      font-weight: 700;
    }

    .feed-desc {
      font-size: 14px;
      opacity: 0.9;
    }

    /* ================= PROFILE ================= */
    #profile-screen {
      background-color: var(--bg-light);
      padding: 20px;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 10px;
    }

    .profile-info h1 {
      font-size: 26px;
      font-weight: 700;
    }

    .profile-info p {
      font-size: 15px;
      color: #666;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #eee;
      object-fit: cover;
    }

    .auth-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ================= DM SCREEN ================= */
    #dm-screen {
      background-color: var(--bg-light);
    }

    .dm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-gray);
    }

    .dm-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dm-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ccc;
    }

    .dm-user-name {
      font-size: 17px;
      font-weight: 700;
    }

    .streak-badge {
      color: var(--accent-orange);
      font-size: 15px;
      font-weight: 700;
    }

    .chat-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .mystery-block {
      align-self: flex-end;
      width: 100px;
      height: 120px;
      background-color: #8e8e93;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: 700;
      color: #333;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 85%;
    }

    .msg-sender-name {
      font-size: 12px;
      color: #777;
      margin-left: 40px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .msg-avatar-small {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .msg-bubble-black {
      background-color: #000;
      color: #fff;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
    }

    .safety-banner {
      margin-top: 8px;
      padding: 8px;
      text-align: center;
      font-size: 12px;
      color: #555;
    }

    .dm-input-wrapper {
      padding: 10px 15px;
    }

    .dm-input-bubble {
      display: flex;
      align-items: center;
      border: 2px solid #000;
      border-radius: 40px;
      padding: 8px 16px;
    }

    .dm-input-bubble input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      background: transparent;
    }

    /* ================= BOTTOM NAV ================= */
    .bottom-nav {
      height: 65px;
      background-color: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #222;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .nav-item {
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 25%;
      height: 100%;
    }

    .nav-btn-dm {
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid #fff;
      border-radius: 6px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- 1. FEED SCREEN -->
    <section id="feed-screen" class="screen-view active">
      <div class="feed-header">
        <div class="feed-tabs">
          <span class="feed-tab">Friends</span>
          <span class="feed-tab active">For you</span>
        </div>
        <span>🔍</span>
      </div>

      <div class="video-viewport">
        <div class="video-placeholder-text">video</div>

        <div class="right-action-bar">
          <div class="action-item"><span class="action-icon">🤍</span><span class="action-count">67</span></div>
          <div class="action-item"><span class="action-icon">💬</span><span class="action-count">20</span></div>
          <div class="action-item"><span class="action-icon">↪️</span><span class="action-count">20K</span></div>
          <div class="action-item"><span class="action-icon">📑</span><span class="action-count">0</span></div>
        </div>

        <div class="feed-overlay-bottom">
          <div class="feed-handle">@handle</div>
          <div class="feed-desc">desc</div>
        </div>
      </div>
    </section>

    <!-- 2. DM SCREEN -->
    <section id="dm-screen" class="screen-view">
      <header class="dm-header">
        <div class="dm-header-left">
          <div class="dm-avatar"></div>
          <div>
            <span class="dm-user-name">Name</span>
            <span class="streak-badge">🔥35</span>
          </div>
        </div>
        <div>⋮</div>
      </header>

      <div class="chat-body">
        <div class="mystery-block">?</div>
        <div class="msg-group">
          <span class="msg-sender-name">Name</span>
          <div class="msg-row">
            <div class="msg-avatar-small">👤</div>
            <div class="msg-bubble-black">I think I don’t wanna live anymore</div>
          </div>
          <div class="safety-banner">
            If you or someone you know is struggling or in crisis, help is available. You are not alone.
          </div>
        </div>
      </div>

      <div class="dm-input-wrapper">
        <div class="dm-input-bubble">
          <input type="text" placeholder="Message">
        </div>
      </div>
    </section>

    <!-- 3. PROFILE SCREEN -->
    <section id="profile-screen" class="screen-view">
      <div class="profile-header">
        <div class="profile-info">
          <h1 id="user-display-name">Name</h1>
          <p id="user-display-handle">@handle</p>
        </div>
        <img class="avatar-circle" id="profile-avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><circle cx='40' cy='40' r='40' fill='%23eee'/></svg>">
      </div>

      <button class="auth-btn" onclick="signInWithGoogle()">Sign in with Google</button>
    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <div class="nav-item" onclick="switchTab('feed-screen')">🏠</div>
      <div class="nav-item">📷</div>
      <div class="nav-item" onclick="switchTab('dm-screen')">
        <span class="nav-btn-dm">DM</span>
      </div>
      <div class="nav-item" onclick="switchTab('profile-screen')">👤</div>
    </nav>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNj19A3A3764GpZO8rkhLYFrWXk9k_HEM",
      authDomain: "riven-social.firebaseapp.com",
      projectId: "riven-social",
      storageBucket: "riven-social.firebasestorage.app",
      messagingSenderId: "412017575651",
      appId: "1:412017575651:web:82eaf6ad241ac8d6cfe7d6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.signInWithGoogle = async function() {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        updateProfileUI(user);
      } catch (error) {
        console.error("Google Sign-In Error:", error);
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) updateProfileUI(user);
    });

    function updateProfileUI(user) {
      document.getElementById('user-display-name').innerText = user.displayName || "User";
      document.getElementById('user-display-handle').innerText = `@${user.email.split('@')[0]}`;
      if (user.photoURL) {
        document.getElementById('profile-avatar-img').src = user.photoURL;
      }
    }

    // Fixed Tab Switching Function
    window.switchTab = function(screenId) {
      document.querySelectorAll('.screen-view').forEach(screen => {
        screen.classList.remove('active');
      });
      const selected = document.getElementById(screenId);
      if (selected) {
        selected.classList.add('active');
      }
    };
  </script>

</body>
</html>

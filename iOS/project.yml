name: RIVEN

options:
  deploymentTarget:
    iOS: "15.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0

settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.riven.app
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  RIVEN:
    type: application
    platform: iOS

    sources:
      - path: RIVEN

    resources:
      - path: RIVEN/GoogleService-Info.plist

    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore

    settings:
      base:
        INFOPLIST_FILE: RIVEN/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.riven.app
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

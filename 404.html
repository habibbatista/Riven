<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Riven</title>
  <script>
    // GitHub Pages has no server-side routing — any URL that isn't a real
    // file (like /Riven/@Piki) lands here instead of a 404 page. Repackage
    // the path into a query string and send the browser back to the real
    // index.html, which unpacks it back into a clean URL on load.
    var path = location.pathname.replace('/Riven/', '');
    location.replace('/Riven/?redirect=' + encodeURIComponent(path));
  </script>
</head>
<body></body>
</html>
